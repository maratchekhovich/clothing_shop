{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">

        <div class="card auth-card p-4">

            <h3 class="text-center mb-4 auth-title">🔐 Вход</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-success btn-custom w-100 mt-3">
                    Войти
                </button>

                <div class="text-center mt-2">
                    <a href="{% url 'password_reset' %}" class="auth-link">
                        Забыли пароль?
                    </a>
                </div>
            </form>

            <p class="text-center mt-3">
                Нет аккаунта?
                <a href="{% url 'signup' %}" class="auth-link">
                    Зарегистрироваться
                </a>
            </p>

        </div>

    </div>
</div>

{% endblock %}
