{% extends "base.html" %}

{% block content %}
<h2>Мои заказы</h2>

{% for order in orders %}
    <p>
        Заказ #{{ order.id }} ({{ order.created_at }})
        <a href="{% url 'order_detail' order.id %}">Подробнее</a>
    </p>
{% empty %}
    <p>У вас пока нет заказов</p>
{% endfor %}

{% endblock %}
