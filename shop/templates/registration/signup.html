{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card p-4 shadow">

            <h3 class="text-center mb-4">📝 Регистрация</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-success w-100 mt-3">
                    Зарегистрироваться
                </button>
            </form>

            <p class="text-center mt-3">
                Уже есть аккаунт?
                <a href="{% url 'login' %}">Войти</a>
            </p>

        </div>

    </div>
</div>

{% endblock %}
