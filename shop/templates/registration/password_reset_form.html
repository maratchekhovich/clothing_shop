{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-4">

        <div class="card auth-card p-4">

            <h3 class="text-center mb-4 auth-title">📧 Сброс пароля</h3>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-primary btn-custom w-100 mt-3">
                    Отправить письмо
                </button>
            </form>

        </div>

    </div>
</div>

{% endblock %}
